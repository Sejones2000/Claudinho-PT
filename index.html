<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1D1F">
<title>Claudinho PT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Expanded:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E3DE;
  --paper-2:#D8D7D1;
  --ink:#1A1D1F;
  --iron:#5C666E;
  --rule:#BFBEB8;
  --go:#2C6A4F;
  --hold:#A8721A;
  --stop:#93362B;
  --sig:var(--iron);
  --pad:clamp(16px,5vw,28px);
  font-feature-settings:"tnum" 1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);
  font:400 16px/1.5 Archivo,system-ui,sans-serif;
  padding:var(--pad) var(--pad) 96px;
  max-width:560px;margin:0 auto;
  min-height:100vh;
}
h1,h2{font-family:"Archivo Expanded",Archivo,sans-serif;font-weight:800;letter-spacing:-.02em}

/* ---------- masthead ---------- */
.mast{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:22px}
.mast h1{font-size:19px}
.mast time{font-size:13px;color:var(--iron);font-variant-numeric:tabular-nums}

/* ---------- readiness band ---------- */
.band{border-left:4px solid var(--sig);padding:12px 0 12px 14px;margin-bottom:26px}
.band .verdict{font-family:"Archivo Expanded",Archivo,sans-serif;font-weight:700;
  font-size:26px;line-height:1.1;color:var(--sig)}
.band .sub{font-size:13.5px;color:var(--iron);margin-top:4px}
.metrics{list-style:none;margin-top:12px;display:grid;gap:5px}
.metrics li{display:flex;justify-content:space-between;gap:12px;
  font-size:13.5px;border-bottom:1px solid var(--rule);padding-bottom:5px}
.metrics span:last-child{color:var(--iron);font-variant-numeric:tabular-nums;text-align:right}

/* ---------- session ---------- */
.session-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.session-head h2{font-size:15px}
.session-head em{font-style:normal;font-size:13px;color:var(--iron)}

.lift{border-top:1px solid var(--rule);padding:18px 0}
.lift:last-of-type{border-bottom:1px solid var(--rule)}
.lift-top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}
.lift-name{font-size:15px;font-weight:600;line-height:1.25;max-width:58%}
.load{font-family:"Archivo Expanded",Archivo,sans-serif;font-weight:800;
  font-size:clamp(38px,12vw,52px);line-height:.88;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;white-space:nowrap}
.load small{font-size:.32em;font-weight:700;margin-left:3px;color:var(--iron)}
.ramp{display:flex;flex-wrap:wrap;gap:0;margin-top:12px;
  font-size:13px;font-variant-numeric:tabular-nums;color:var(--iron)}
.ramp span{padding-right:9px;margin-right:9px;border-right:1px solid var(--rule)}
.ramp span:last-child{border-right:0;color:var(--ink);font-weight:600}
.was{color:var(--stop);text-decoration:line-through;margin-left:7px;font-weight:400}

/* ---------- explainer ---------- */
details.why{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
details.why summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why summary::after{content:" +";color:var(--iron)}
details.why[open] summary::after{content:" −"}
details.why p{margin-top:12px;font-size:14.5px;line-height:1.62;color:#33393D;max-width:64ch}
details.why p+p{margin-top:10px}
details.tools{margin-top:30px;border-top:2px solid var(--ink);padding-top:16px}
details.tools summary{cursor:pointer;font-size:15px;font-weight:600;
  font-family:"Archivo Expanded",Archivo,sans-serif;list-style:none}
details.tools summary::-webkit-details-marker{display:none}
details.tools summary::after{content:" +";color:var(--iron)}
details.tools[open] summary::after{content:" \2212"}
details.tools .note{margin:12px 0 4px}
details.tools button{margin-top:10px}
.verdict-row{display:flex;justify-content:space-between;gap:14px;
  font-size:13.5px;border-bottom:1px solid var(--rule);padding:8px 0}
.verdict-row span:first-child{font-weight:600;white-space:nowrap}
.verdict-row span:last-child{color:var(--iron);text-align:right}

/* ---------- forms ---------- */
.entry{margin-top:30px;border-top:2px solid var(--ink);padding-top:18px}
.entry h2{font-size:15px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:12.5px;color:var(--iron);margin-bottom:4px}
input{width:100%;padding:11px 12px;font:600 17px Archivo,sans-serif;
  font-variant-numeric:tabular-nums;color:var(--ink);
  background:var(--paper-2);border:1px solid var(--rule);border-radius:2px}
input:focus{outline:2px solid var(--ink);outline-offset:1px}

button{font:600 15px Archivo,sans-serif;padding:14px 18px;border:0;border-radius:2px;
  background:var(--ink);color:var(--paper);cursor:pointer;width:100%;margin-top:16px}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.note{font-size:13px;color:var(--iron);margin-top:12px}
.err{color:var(--stop);font-weight:600}
.stale{background:var(--paper-2);border-left:4px solid var(--hold);
  padding:10px 14px;font-size:13.5px;margin-bottom:20px}
.empty{padding:40px 0;font-size:15px;color:var(--iron);max-width:46ch}
@media (prefers-reduced-motion:no-preference){
  .lift{animation:rise .32s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
}
</style>
</head>
<body>

<header class="mast">
  <h1>Claudinho PT</h1>
  <time id="date"></time>
</header>

<div id="app"><p class="empty">Loading today.</p></div>

<script>
const CFG = {
  edge: localStorage.getItem('pt_edge') || '',
  token: localStorage.getItem('pt_token') || ''
};

const $ = (s) => document.querySelector(s);
const today = () => new Date().toISOString().slice(0,10);
const fmt = (n) => Number(n) % 1 ? Number(n).toFixed(1) : String(Number(n));

document.getElementById('date').textContent =
  new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

async function call(action, body={}){
  const res = await fetch(CFG.edge, {
    method:'POST',
    headers:{'content-type':'application/json','x-app-token':CFG.token},
    body: JSON.stringify({action, ...body})
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

/* ---------- setup ---------- */
function setup(){
  $('#app').innerHTML = `
    <section class="entry" style="border-top:0;padding-top:0">
      <h2>Connect this device</h2>
      <p class="note" style="margin:0 0 16px">These stay on this device only. They're never
      written into the page source, so the published site gives nothing away.</p>
      <label for="e">Edge function URL</label>
      <input id="e" placeholder="https://….supabase.co/functions/v1/pt">
      <div style="height:12px"></div>
      <label for="t">App token</label>
      <input id="t" type="password" placeholder="your APP_TOKEN">
      <button id="save">Save and load today</button>
    </section>`;
  $('#save').onclick = () => {
    localStorage.setItem('pt_edge', $('#e').value.trim());
    localStorage.setItem('pt_token', $('#t').value.trim());
    location.reload();
  };
}

/* ---------- rendering ---------- */
function renderBand(score){
  if(!score) return '';
  const map = {green:['var(--go)','Good to go'],
               amber:['var(--hold)','Train, but trimmed'],
               red:['var(--stop)','Reduced session today']};
  const [colour, verdict] = map[score.band];
  const sub = score.baselineDays < 14
    ? `Scored against ${score.baselineDays} days of history — the model sharpens as that grows.`
    : `Scored against your rolling ${score.baselineDays}-day baseline.`;
  return `
    <div class="band" style="--sig:${colour}">
      <div class="verdict">${verdict}</div>
      <div class="sub">${sub}</div>
      <ul class="metrics">
        ${score.parts.map(p=>`<li><span>${p.key}</span><span>${p.note}</span></li>`).join('')}
      </ul>
    </div>`;
}

function renderLift(ex, before){
  const sets = ex.sets || [];
  const top = sets[sets.length-1] || {};
  const old = before?.sets?.[before.sets.length-1];
  const changed = old && old.weight !== top.weight;
  return `
    <article class="lift">
      <div class="lift-top">
        <div class="lift-name">${ex.name}</div>
        <div class="load">${top.weight!=null?fmt(top.weight):'—'}<small>${top.weight!=null?'kg':''}</small></div>
      </div>
      <div class="ramp">
        ${sets.map(s=>`<span>${s.weight!=null?fmt(s.weight)+'×':''}${s.reps}</span>`).join('')}
        ${changed?`<span class="was">was ${fmt(old.weight)}</span>`:''}
      </div>
    </article>`;
}

function renderEntry(r={}){
  const f = (id,label,ph,val) =>
    `<div><label for="${id}">${label}</label>
     <input id="${id}" inputmode="decimal" placeholder="${ph}" value="${val??''}"></div>`;
  return `
    <section class="entry">
      <h2>This morning's numbers</h2>
      <div class="grid">
        ${f('hrv','HRV (ms)','54',r.hrv)}
        ${f('rhr','Resting HR','48',r.resting_hr)}
        ${f('sleep','Sleep (hours)','7.5',r.sleep_hours)}
        ${f('bb','Body battery at wake','72',r.body_battery_wake)}
        ${f('subj','How you feel (1–5)','4',r.subjective)}
      </div>
      <button id="saveR">${r.hrv?'Update and rescore':'Score my readiness'}</button>
      <p class="note" id="rnote"></p>
    </section>`;
}

function render(state){
  const {session, readiness, score, adjustments, offline} = state;
  const adj = (adjustments||[])[0];
  const before = adj?.before;

  $('#app').innerHTML = `
    ${offline?`<div class="stale">Showing the session saved on this device. It'll refresh
      when you're back online.</div>`:''}
    ${renderBand(score)}
    ${session ? `
      <div class="session-head">
        <h2>${session.title}</h2>
        <em>${(session.exercises||[]).length} lifts</em>
      </div>
      ${(session.exercises||[]).map((ex,i)=>renderLift(ex, before?.[i])).join('')}
      ${adj?.science_note ? `
        <details class="why">
          <summary>Why today looks like this</summary>
          ${adj.science_note.split(/\n\n+/).map(p=>`<p>${p}</p>`).join('')}
        </details>` : ''}
      <button id="push" class="ghost"${session.status==='pushed'?' disabled':''}>
        ${session.status==='pushed'?'Sent to Lyfta':'Send to Lyfta'}</button>
      <p class="note" id="pnote"></p>
    ` : `<p class="empty">No session scheduled for today. Rest day, or generate the week
         from the coach.</p>`}
    ${renderEntry(readiness||{})}
    ${renderTools()}
  `;

  $('#saveR').onclick = async () => {
    const num = (id) => { const v = $('#'+id).value.trim(); return v===''?null:Number(v); };
    $('#saveR').disabled = true;
    $('#rnote').textContent = 'Scoring…';
    try{
      const out = await call('save_readiness',{date:today(),readiness:{
        hrv:num('hrv'), resting_hr:num('rhr'), sleep_hours:num('sleep'),
        body_battery_wake:num('bb'), subjective:num('subj')
      }});
      const fresh = await call('today',{date:today()});
      cache(fresh); render(fresh);
    }catch(e){
      $('#saveR').disabled = false;
      $('#rnote').innerHTML = `<span class="err">${e.message}</span>`;
    }
  };

  const push = $('#push');
  if(push && !push.disabled) push.onclick = async () => {    push.disabled = true; $('#pnote').textContent = 'Sending…';
    try{
      await call('push_to_lyfta',{session_id:session.id});
      push.textContent = 'Sent to Lyfta';
      $('#pnote').textContent = 'Open Lyfta — it\'s in the Claudinho PT collection.';
    }catch(e){
      push.disabled = false;
      $('#pnote').innerHTML = `<span class="err">${e.message}</span>`;
    }
  };

  wireTools();
}

/* ---------- coach tools ---------- */
const BLOCK_START = '2026-09-15';           // Madcow week 1, Monday

function nextMonday(){
  const d = new Date();
  d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7));
  return d.toISOString().slice(0,10);
}
function weekNoFor(dateStr){
  const days = (new Date(dateStr) - new Date(BLOCK_START)) / 864e5;
  return Math.floor(days / 7) + 1;
}

function renderTools(){
  const mon = nextMonday();
  return `
    <details class="tools">
      <summary>Coach tools</summary>
      <p class="note">Sync pulls your completed Lyfta workouts back in and moves each
      lift up, holds it, or deloads it. Plan builds the next four sessions from
      whatever the lifts say afterwards — so sync first.</p>
      <button id="sync" class="ghost">Sync results from Lyfta</button>
      <button id="plan" class="ghost">Plan week ${weekNoFor(mon)} (from ${mon})</button>
      <p class="note" id="tnote"></p>
      <div id="tout"></div>
    </details>`;
}

function wireTools(){
  const note = (msg, err) =>
    $('#tnote').innerHTML = err ? `<span class="err">${msg}</span>` : msg;

  $('#sync').onclick = async () => {
    $('#sync').disabled = true; note('Reading Lyfta…');
    try{
      const out = await call('sync_completions', { from: BLOCK_START });
      if(!out.synced){
        note('Nothing new to sync. Sessions only match if they were sent from here.');
      } else {
        note(`Synced ${out.synced} session${out.synced>1?'s':''}.`);
        $('#tout').innerHTML = out.outcomes.flatMap(o =>
          o.result.map(r => `<div class="verdict-row"><span>${r.lift}</span>
            <span>${r.verdict}</span></div>`)).join('');
      }
    }catch(e){ note(e.message, true); }
    $('#sync').disabled = false;
  };

  $('#plan').onclick = async () => {
    const start = nextMonday();
    $('#plan').disabled = true; note('Building…');
    try{
      const out = await call('generate_week', {
        start_date: start,
        week_no: weekNoFor(start),
        days: [
          { offset: 0, type: 'heavy' },
          { offset: 2, type: 'light' },
          { offset: 4, type: 'top_set' },
          { offset: 5, type: 'pump' }
        ]
      });
      note(`Created ${out.sessions.length} sessions from ${start}.`);
    }catch(e){
      $('#plan').disabled = false;
      note(e.message.includes('duplicate') ?
        'Those sessions already exist.' : e.message, true);
    }
  };
}

/* ---------- offline cache ---------- */
function cache(state){
  try{ localStorage.setItem('pt_today', JSON.stringify({date:today(), state})); }catch{}
}
function cached(){
  try{
    const c = JSON.parse(localStorage.getItem('pt_today')||'null');
    return c && c.date===today() ? c.state : null;
  }catch{ return null; }
}

/* ---------- boot ---------- */
(async () => {
  if(!CFG.edge || !CFG.token) return setup();
  try{
    const state = await call('today',{date:today()});
    cache(state);
    render(state);
  }catch(e){
    const c = cached();
    if(c) return render({...c, offline:true});
    $('#app').innerHTML = `<p class="empty"><span class="err">${e.message}</span><br><br>
      <button class="ghost" onclick="localStorage.removeItem('pt_edge');location.reload()">
      Re-enter connection details</button></p>`;
  }
})();
</script>
</body>
</html>
